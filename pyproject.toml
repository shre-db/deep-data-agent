[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-data-agent"
version = "0.2.0"
description = "Prototype natural-language data analysis agent built on Deep Agents."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.9",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
